name: Deploy Production Moscow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: productionmoscow-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: [self-hosted, mac-mini, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and rendered checks
        run: npm test

      - name: Deploy to the existing Mac mini runner
        run: |
          set -eu
          /Users/clevent/server/scripts/deploy-github-site.sh \
            productionmoscow/production-moscow \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_SHA"
