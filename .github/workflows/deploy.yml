name: Deploy Production Moscow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: productionmoscow-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: [self-hosted, mac-mini, arm64]

    env:
      DEPLOY_ROOT: /Users/clevent/server/sites/production-moscow
      SERVICE_LABEL: com.productionmoscow.website
      DOCKER_BIN: /Users/clevent/.docker/bin/docker
      EDGE_COMPOSE_FILE: /Users/clevent/server/migration/compose.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and rendered checks
        run: npm test

      - name: Test Zoom Prokat parser
        run: |
          set -euo pipefail
          npm ci --prefix scripts/zoom-prokat-parser --ignore-scripts --no-audit --no-fund
          npm test --prefix scripts/zoom-prokat-parser

      - name: Deploy release locally
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -x "$DOCKER_BIN"
          test -f deploy/macos/productionmoscow-start.sh
          test -f deploy/macos/productionmoscow-bridge.mjs

          install -d -m 755 "$DEPLOY_ROOT/releases" "$DEPLOY_ROOT/bin"
          install -d -m 700 "$DEPLOY_ROOT/data" "$DEPLOY_ROOT/config"
          install -d -m 755 "$DEPLOY_ROOT/logs"
          rm -rf -- "$DEPLOY_ROOT/zoom-prokat-parser"
          install -d -m 755 "$DEPLOY_ROOT/zoom-prokat-parser"
          rsync -a --checksum scripts/zoom-prokat-parser/ "$DEPLOY_ROOT/zoom-prokat-parser/"
          npm ci --prefix "$DEPLOY_ROOT/zoom-prokat-parser" --ignore-scripts --no-audit --no-fund
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            umask 077
            printf 'OPENROUTER_API_KEY=%s\nPRODUCTIONMOSCOW_AI_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free\nPRODUCTIONMOSCOW_AI_BASE_URL=https://openrouter.ai/api/v1\n' \
              "$OPENROUTER_API_KEY" > "$DEPLOY_ROOT/config/productionmoscow.env"
            chmod 600 "$DEPLOY_ROOT/config/productionmoscow.env"
          fi
          release="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          rm -rf -- "$release"
          install -d -m 755 "$release"
          rsync -a --checksum dist/ "$release/dist/"
          install -m 644 package.json package-lock.json "$release/"
          install -m 755 deploy/macos/productionmoscow-start.sh \
            "$DEPLOY_ROOT/bin/productionmoscow-start.sh"
          install -m 644 deploy/macos/productionmoscow-bridge.mjs \
            "$DEPLOY_ROOT/bin/productionmoscow-bridge.mjs"
          install -m 755 scripts/crawl-site-knowledge.mjs \
            "$DEPLOY_ROOT/bin/crawl-site-knowledge.mjs"
          install -m 755 deploy/macos/productionmoscow-knowledge-start.sh \
            "$DEPLOY_ROOT/bin/productionmoscow-knowledge-start.sh"
          install -m 644 deploy/macos/com.productionmoscow.knowledge-crawler.plist \
            "$DEPLOY_ROOT/config/com.productionmoscow.knowledge-crawler.plist"

          "$DEPLOY_ROOT/runtime/node/bin/npm" ci \
            --prefix "$release" --ignore-scripts --no-audit --no-fund

          ln -sfn "$release" "$DEPLOY_ROOT/current"

      - name: Install weekly knowledge crawler
        run: |
          set -euo pipefail
          launch_agents="$HOME/Library/LaunchAgents"
          label="com.productionmoscow.knowledge-crawler"
          plist="$launch_agents/$label.plist"
          install -d -m 755 "$launch_agents"
          install -m 644 "$DEPLOY_ROOT/config/$label.plist" "$plist"
          launchctl bootout "gui/$(id -u)/$label" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$(id -u)" "$plist"

      - name: Restart only Production Moscow and verify local service
        run: |
          set -euo pipefail
          service="gui/$(id -u)/$SERVICE_LABEL"
          launchctl print "$service" >/dev/null
          launchctl kickstart -k "$service"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3011/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo 'Production Moscow service did not become healthy within 60 seconds' >&2
          launchctl print "$service" || true
          exit 1

      - name: Remove old Production Moscow releases
        if: success()
        run: |
          set -euo pipefail
          current_release="$(readlink "$DEPLOY_ROOT/current" || true)"
          keep=4

          find "$DEPLOY_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -print0 \
            | xargs -0 -n1 stat -f '%m %N' \
            | sort -rn \
            | cut -d' ' -f2- \
            | while IFS= read -r release; do
                if [ "$release" = "$current_release" ]; then
                  continue
                fi
                if [ "$keep" -gt 0 ]; then
                  keep=$((keep - 1))
                else
                  rm -rf -- "$release"
                fi
              done
