name: Deploy Production Moscow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: productionmoscow-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and rendered checks
        run: npm test

      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.PRODUCTIONMOSCOW_SSH_HOST || secrets.ANTON_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTIONMOSCOW_SSH_PORT || secrets.ANTON_SSH_PORT }}
          SSH_KEY: ${{ secrets.PRODUCTIONMOSCOW_SSH_KEY || secrets.ANTON_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST"
          test -n "$SSH_KEY"
          SSH_PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/productionmoscow_deploy_key
          chmod 600 ~/.ssh/productionmoscow_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.PRODUCTIONMOSCOW_SSH_HOST || secrets.ANTON_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTIONMOSCOW_SSH_USER || secrets.ANTON_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTIONMOSCOW_SSH_PORT || secrets.ANTON_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTIONMOSCOW_DEPLOY_PATH || '/var/www/productionmoscow.ru' }}
        run: |
          set -eu
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$DEPLOY_PATH"
          SSH_PORT="${SSH_PORT:-22}"
          RELEASE_PATH="${DEPLOY_PATH%/}/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/productionmoscow_deploy_key -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '$RELEASE_PATH'"
          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/productionmoscow_deploy_key -p ${SSH_PORT}" \
            dist/ "${SSH_USER}@${SSH_HOST}:${RELEASE_PATH}/dist/"
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/productionmoscow_deploy_key -p ${SSH_PORT}" \
            package.json package-lock.json \
            "${SSH_USER}@${SSH_HOST}:${RELEASE_PATH}/"
          ssh -i ~/.ssh/productionmoscow_deploy_key -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '$RELEASE_PATH' && npm ci --ignore-scripts --no-audit --no-fund"

      - name: Activate release and verify local service
        env:
          SSH_HOST: ${{ secrets.PRODUCTIONMOSCOW_SSH_HOST || secrets.ANTON_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTIONMOSCOW_SSH_USER || secrets.ANTON_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTIONMOSCOW_SSH_PORT || secrets.ANTON_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTIONMOSCOW_DEPLOY_PATH || '/var/www/productionmoscow.ru' }}
        run: |
          set -eu
          SSH_PORT="${SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          RELEASE_PATH="$DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/productionmoscow_deploy_key -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "set -e
            ln -sfn '$RELEASE_PATH' '$DEPLOY_PATH/current'
            sudo systemctl restart productionmoscow.service
            for attempt in \$(seq 1 30); do
              if sudo systemctl is-active --quiet productionmoscow.service && curl -fsS --max-time 5 http://127.0.0.1:3011/ >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            echo 'Production Moscow service did not become healthy within 60 seconds' >&2
            sudo systemctl is-active productionmoscow.service || true
            exit 1"

      - name: Remove old releases
        if: success()
        env:
          SSH_HOST: ${{ secrets.PRODUCTIONMOSCOW_SSH_HOST || secrets.ANTON_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTIONMOSCOW_SSH_USER || secrets.ANTON_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTIONMOSCOW_SSH_PORT || secrets.ANTON_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTIONMOSCOW_DEPLOY_PATH || '/var/www/productionmoscow.ru' }}
        run: |
          set -eu
          SSH_PORT="${SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          ssh -i ~/.ssh/productionmoscow_deploy_key -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "CURRENT_RELEASE=\$(readlink -f '$DEPLOY_PATH/current' || true)
            KEEP=4
            find '$DEPLOY_PATH/releases' -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\\n' | sort -nr | cut -d' ' -f2- |
            while IFS= read -r release; do
              if [ \"\$release\" = \"\$CURRENT_RELEASE\" ]; then
                continue
              fi
              if [ \"\$KEEP\" -gt 0 ]; then
                KEEP=\$((KEEP - 1))
              else
                rm -rf -- \"\$release\"
              fi
            done"
